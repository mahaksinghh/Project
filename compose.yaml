services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guardian-local}
      POSTGRES_DB: guardian
    volumes:
      - reports:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "guardian", "-d", "guardian"]
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://guardian:guardian-local@db:5432/guardian}
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:3000}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  reports:
